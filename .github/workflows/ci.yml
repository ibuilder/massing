name: CI

on:
  push:
    branches: [main]
  pull_request:

# Supersede a PR's own older runs; never supersede a run on main.
#
# There was no concurrency control at all, and the cost is per-rebase: this suite takes ~17–40 min
# (the API gate dominates), a PR rebase pushes a new head, and the run for the old head keeps going
# to completion against a tree nobody will merge. One branch was rebased three times in a single
# sitting on 2026-08-06 — three full suites, two of them answering about superseded commits.
#
# The obvious spelling is a trap, and it is the same one that had `pages.yml` timing out for two
# hours the same day:
#
#     group: ci-${{ github.ref }}          # main pushes all share ONE group
#     cancel-in-progress: false            # so they QUEUE — and only one may be pending, so an
#                                          # older pending run is CANCELLED, never run at all
#
# That silently stops testing intermediate commits on main, which is precisely what "tag only on
# green" depends on. Grouping by `github.run_id` for pushes gives every main commit its own group,
# so nothing on main ever cancels anything and all of them still run in parallel. Only pull requests
# share a group, keyed by head branch, where superseding is exactly what you want.
#
# `a && b || c` is GitHub's ternary. `cancel-in-progress: true` is safe here ONLY because the push
# groups are unique — read the two lines together or the second one looks reckless.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: true

# least privilege: these jobs only read the repo
permissions:
  contents: read

jobs:
  api-tests:
    name: API test gate
    runs-on: ubuntu-latest
    steps:
      # `fetch-tags` is load-bearing, not tidiness. The default checkout is shallow and fetches NO
      # tags, so `git tag -l` returns empty — and `test_release_current.py` compares the shipped
      # version against the newest tag. Without this it would see zero tags and, had it been written
      # to shrug at that, would have been green forever while measuring nothing. It fails loudly
      # instead, so removing this line reds the build rather than silencing the check.
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # system libs the scientific wheels expect (mirrors services/api/Dockerfile)
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Python deps
        run: |
          python -m pip install --upgrade pip
          # B2: install the hash-pinned runtime lock (rejects substituted wheels); it covers the
          # data-service deps too (a strict subset). Dev-only tools install separately (unhashed).
          pip install --require-hashes -r services/api/requirements.lock
          pip install -r services/api/requirements-dev.txt

      - name: Lint (ruff — dead code + real defects)
        run: cd services/api && python -m ruff check src/ ../data/src/

      - name: Run test gate
        run: python services/api/run_tests.py

  web-build:
    name: Web typecheck + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      # this is an npm workspace (root lock); install at the root, then build the web workspace
      - name: Install
        run: npm ci

      # B1: the client parser + the two server-side .frag producers must pin the same fragments/web-ifc.
      - name: Fragments/web-ifc version guard
        run: node scripts/check-fragments-version.mjs

      # The root `scripts/` and `services/converter/src/` were covered by no ESLint config until
      # v0.3.1099 — `apps/web`'s config reaches `apps/web/scripts/` and cannot reach above its own
      # base path. The step below is the one that lints the program the step ABOVE runs.
      - name: Lint (ESLint — root scripts + converter)
        run: npm run lint

      - name: Lint (ESLint)
        run: npm run lint --workspace apps/web

      - name: Unit tests (Vitest)
        run: npm run test --workspace apps/web

      - name: Typecheck + build
        run: npm run build --workspace apps/web

      - name: Bundle-size budget (app shell)
        run: npm run budget --workspace apps/web

      # "The viewer must run fully offline" is the fourth non-negotiable in CLAUDE.md, and until
      # 2026-08-27 nothing enforced it — a headless-browser run found `three-*.js` opening with a
      # static `import … from "https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/+esm"`, reached through
      # `@thatopen/components-front` → three's `TTFLoader`. Offline, that chunk never evaluates and
      # the whole viewer fails to mount with nothing on screen to say why.
      #
      # It runs after the build because it greps the OUTPUT: an alias that stops matching after a
      # dependency bump still builds clean, which is the same trap `vite.config.ts` documents for the
      # vendor split. Costs about a second.
      - name: Offline check (no bundled import reaches the network)
        run: npm run offline --workspace apps/web

      # R41-LICENCE-GATE. Runs HERE and not in the API gate on purpose: this job is the one that
      # runs `npm ci`, so `node_modules` exists. The API job does not install it, and a licence scan
      # over an absent tree passes by finding nothing — the vacuous-population failure this repo has
      # hit repeatedly. Where a check runs is part of its claim.
      #
      # `services/api/test_license_gate.py` already fails on a GPL/AGPL **Python** distribution, from
      # its **declared metadata**. This covers the 638-package **npm** tree, which that gate never
      # saw, and reads each package's **LICENSE file** rather than its badge — because the item this
      # implements exists precisely because declarations and licence files disagree.
      - name: Licence allowlist (npm tree, reads LICENSE files)
        run: npm run licences --workspace apps/web

  # Container supply chain: build the deployable images, scan them, and (on main) publish to ghcr
  # with an immutable :sha tag so production can pin digests instead of pulling a mutable :latest.
  containers:
    name: Container build + scan + publish
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: api, context: ., dockerfile: services/api/Dockerfile }
          - { name: web, context: ., dockerfile: apps/web/Dockerfile }
          - { name: converter, context: ., dockerfile: services/converter/Dockerfile }
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
      - name: Log in to ghcr
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ghcr.io/${{ github.repository }}-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Vulnerability GATE: fixable CRITICAL findings block the publish. (O4 note: we tried gating on
      # HIGH too, but the base images — node's bundled npm CLI tooling and nginx:alpine's apk set —
      # carry a rolling wave of fixable HIGH CVEs we can't pin from here, which would keep the pipeline
      # red on churn outside our control. So CRITICAL blocks; HIGH is surfaced report-only below.)
      - name: Scan — gate (Trivy, CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}-${{ matrix.name }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Visibility (non-blocking): print fixable HIGH CVEs every build so they don't ship *silently* —
      # a human reviewing the run can act on ones in our own deps without the base-image noise blocking.
      - name: Scan — report HIGH (Trivy, non-blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}-${{ matrix.name }}:${{ github.sha }}
          severity: HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Push image
        run: |
          docker push ghcr.io/${{ github.repository }}-${{ matrix.name }}:${{ github.sha }}
          docker tag ghcr.io/${{ github.repository }}-${{ matrix.name }}:${{ github.sha }} \
                     ghcr.io/${{ github.repository }}-${{ matrix.name }}:latest
          docker push ghcr.io/${{ github.repository }}-${{ matrix.name }}:latest

  # ─────────────────────────────────────────────────────────────────────────────────────────────
  # R39-CONTAINER-PR. The publish job above is gated `push` + `refs/heads/main`, so on every pull
  # request it reports **`skipping`** and *structurally cannot* exercise a change to itself. Both
  # Dockerfiles, `build-push-action` 6→7 (#276) and `setup-buildx-action` 3→4 (#279) all merged
  # all-green — a 21-minute API gate, a web build, CodeQL — and not one of those greens had run a
  # container build. A break landed straight on main with no PR to revert.
  #
  # `services/api/test_container_pr_gate.py` holds the shape of what follows: same images as the
  # publish matrix, no registry credentials, nothing pushed.
  # ─────────────────────────────────────────────────────────────────────────────────────────────

  # Which of a PR's files can change what a container build produces.
  #
  # Why this is its own job rather than an `if:` on the build steps: a job whose every step was
  # skipped still reports **success**, and "a skipped job is not a passed job" is the precise
  # confusion this item exists to remove. Gating the *job* makes GitHub render it as `skipped`,
  # which is the truth. The cost of being honest is one ~5s runner.
  #
  # Listed from the API rather than `git diff`, because a `pull_request` checkout is shallow and the
  # base commit is not guaranteed to be present locally — a diff against a ref that is not there
  # fails, and the tempting fix (`|| true`) turns the filter into a permanent "no".
  docker-scope:
    name: Does this PR touch a container build?
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      touched: ${{ steps.q.outputs.touched }}
    steps:
      - id: q
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Fail SAFE, not quiet. Any failure to enumerate the changed files runs the build anyway:
          # the outcome this whole item was written about is a container change that shipped because
          # nothing exercised it, and "the API 500'd" is not a better reason than "the job was
          # gated off". The API also caps a listing at 3000 files, and a truncated listing is
          # indistinguishable from a short one — so a PR that large is treated as touching.
          if ! files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename'); then
            echo "could not enumerate the PR's files — building the containers anyway"
            echo "touched=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$files"
          if [ "$(printf '%s\n' "$files" | wc -l)" -ge 3000 ]; then
            echo "3000-file API cap reached — the listing may be truncated, building anyway"
            echo "touched=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Kept in sync with the build matrix by test_container_pr_gate.py, which runs this very
          # pattern against each matrix `dockerfile` path AND against every dependency manifest
          # those Dockerfiles install from.
          #
          # The manifests are here because a Dockerfile is not the only build input it has. The API
          # image does `COPY services/api/requirements.lock` then `pip install --require-hashes` from
          # it, and the web image copies `package.json` / `package-lock.json` before `npm ci` — so a
          # dependency change alters the image without touching a single line matched above. Until
          # 2026-08-28 none of those four paths was in this pattern, which meant every pip and npm
          # bump reported `Container build (PR, no push)  skipping` and merged without any job ever
          # building the image whose contents it had just changed. That is the same "a skipped job is
          # not a passed job" hole this whole item exists to close, arriving through the input the
          # filter was not watching rather than the one it was.
          if printf '%s\n' "$files" | grep -qE '(^|/)Dockerfile$|(^|/)\.dockerignore$|^\.github/workflows/ci\.yml$|(^|/)package(-lock)?\.json$|(^|/)requirements\.lock$'; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
          fi

  # Build the deployable images on a PR, and never push one.
  #
  # Deliberately credential-free: no ghcr login, no `packages: write`, nothing pushed — so it is
  # safe on a fork PR, where `secrets.GITHUB_TOKEN` is read-only anyway. The Trivy CRITICAL gate is
  # repeated here on purpose: a base-image bump that introduces a fixable CRITICAL turns the publish
  # job red *on main*, which is the same "break lands directly on main" this item names. Catching it
  # on the PR costs nothing extra — the image is already loaded into the local daemon.
  containers-pr:
    name: Container build (PR, no push)
    runs-on: ubuntu-latest
    needs: docker-scope
    if: needs.docker-scope.outputs.touched == 'true'
    permissions:
      contents: read
    strategy:
      # Every image, even when one fails: "the api image broke" and "all three images broke" are
      # different findings, and fail-fast would report the first as the second.
      fail-fast: false
      matrix:
        include:
          - { name: api, context: ., dockerfile: services/api/Dockerfile }
          - { name: web, context: ., dockerfile: apps/web/Dockerfile }
          - { name: converter, context: ., dockerfile: services/converter/Dockerfile }
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      # No `cache-to`: an Actions cache written from a PR branch is scoped to that branch and can
      # never be read by main, so writing one is pure churn. Reading main's is the useful half.
      - name: Build image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: massing-${{ matrix.name }}:pr
          cache-from: type=gha

      - name: Scan — gate (Trivy, CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: massing-${{ matrix.name }}:pr
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
