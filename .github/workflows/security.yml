name: Dependency scan

# Report-only supply-chain scan (pip-audit + npm audit). Non-blocking by design — it surfaces
# known CVEs in the job summary without failing the merge gate (ci.yml stays the hard gate).
# Runs weekly and on dependency-manifest changes.

on:
  schedule:
    - cron: "0 6 * * 1"          # Mondays 06:00 UTC
  push:
    branches: [main]
    paths:
      # `.lock` and `.in` are NOT covered by the `*.txt` glob, and their absence was a real hole:
      # this workflow audits `services/api/requirements.lock`, and until 2026-08-09 a change to that
      # exact file could not trigger the workflow that audits it. The CVE bumps that found this ran
      # only because the same commit happened to touch security.yml. A check's TRIGGER is part of its
      # scope, and a scope that excludes its own subject is not a smaller check — it is no check.
      # `test_lock_advisories.py` now asserts every audited path matches one of these globs.
      - "**/requirements*.txt"
      - "**/requirements*.lock"
      - "**/requirements*.in"
      - "**/package.json"
      - "**/package-lock.json"
      - ".github/workflows/security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks scans HISTORY - the default depth-1 clone would hand it exactly one
          # commit, and it would report "clean over the full history" having seen the tip:
          # the scanner-that-never-ran failure this step's own comment warns about.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }   # match ci.yml — audit the interpreter that actually ships
      - run: pip install pip-audit bandit
      - name: pip-audit (api + data)
        continue-on-error: true        # report-only
        run: |
          for req in services/api/requirements.lock services/data/requirements.txt; do
            echo "## $req" >> "$GITHUB_STEP_SUMMARY"
            pip-audit -r "$req" --desc --format markdown >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          done
      - name: pip-audit — GATE on advisories that HAVE a published fix (blocking)
        # The report-only step above is a triage surface and stays that way. It is also, on its own,
        # a check with no failure mode: it carries continue-on-error AND a trailing `|| true`, and on
        # 2026-08-09 it was found to have been reporting a HIGH in cryptography (CVE-2026-69247) into
        # a step summary while this job reported success. Same shape as the bandit pair below —
        # report everything, block on the part that is unambiguously actionable.
        #
        # Blocks only where a fix version exists, because only then is there something to do. See
        # scripts/audit_lock_gate.py for why that asymmetry is the design and not a loophole.
        # Do not weaken this step; test_lock_advisories.py asserts that neither escape hatch is
        # present, which is the only reason it cannot quietly revert to what it replaced.
        run: python scripts/audit_lock_gate.py

      - name: bandit (code security scan, medium+ severity)
        continue-on-error: true        # report-only — surfaces XXE / SSRF / injection patterns
        run: |
          echo "## bandit (services/api + services/data)" >> "$GITHUB_STEP_SUMMARY"
          bandit -q -r services/api/src services/data/src -ll -ii >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
      - name: bandit — GATE on HIGH severity (blocking)
        # The medium+ step above is report-only and stays that way: it is a triage surface, and a
        # blocking check that cries wolf is one people learn to scroll past — this repo already
        # recorded that lesson when a permanently-red analyser trained everyone to ignore red.
        #
        # HIGH is different, and 2026-07-31 is why this exists. A HIGH finding (B613, bidirectional
        # control characters) sat in this workflow's step summary unread for as long as it existed,
        # while the code it flagged was the MCP tool-poisoning detector — whose own character class
        # was written in invisible characters and, as a direct result, missed U+202E entirely. The
        # scanner did its job; nothing was listening.
        #
        # Zero HIGH findings as of this commit, so the gate starts green and can only be tripped by
        # something new. If it fires, read it — do not add continue-on-error.
        run: |
          bandit -q -r services/api/src services/data/src -lll -ii

      - name: gitleaks — secret scan of the full git history
        # SEC-G1. Nothing scanned for committed secrets before this; audits used ad-hoc grep, which
        # finds what it is asked for and nothing else.
        #
        # Scans HISTORY, not just the working tree. A secret that was committed and later "removed"
        # is still in the objects and still published — the working tree is the one place it is
        # guaranteed NOT to be.
        #
        # --redact is load-bearing on a PUBLIC repo. Without it a found secret is printed verbatim
        # into a world-readable Actions log, so the scanner would CREATE the exposure it exists to
        # report. Do not remove it.
        #
        # FINDINGS NOW GATE. A tool failure always did: `set -euo pipefail` and the explicit binary
        # check mean a bad URL, a renamed release asset or a failed extract fail this step loudly.
        # `continue-on-error` on the whole step would make all three indistinguishable from "no
        # secrets found" — a scanner that never ran, reporting clean.
        #
        # The baseline this waited for is `.gitleaksignore`: five fingerprints, each with a reason,
        # all triaged 2026-08-02 as false positives with nothing to rotate. Same order bandit went
        # through, and the reason its HIGH gate could start green.
        #
        # An UNKNOWN finding now fails the build. That is the whole point, and it is also the one
        # way this step can hurt: the fix for a real secret is to ROTATE IT FIRST and then purge it
        # from history — never to add a line to .gitleaksignore, which silences the report while
        # leaving the credential published in the objects for anyone who clones.
        env:
          GITLEAKS_VERSION: "8.30.1"
          # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's own checksums file.
          # HARDCODED on purpose rather than downloaded alongside the tarball: a checksums file
          # fetched from the same origin as the artefact is signed by nothing and moves with it, so
          # it catches corruption and catches nothing else. A digest committed here fails even when
          # the release asset itself is replaced, which is the attack this step exists to survive —
          # the binary is DOWNLOADED AND EXECUTED in CI with repo access.
          # Bumping GITLEAKS_VERSION without bumping this fails loudly at `sha256sum --check`, which
          # is the correct outcome: the two are one fact and must move together.
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          GITLEAKS_RC=0          # set -u: must exist before the || below can assign it
          curl -sSfL -o gitleaks.tar.gz             "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --status             || { echo "::error::gitleaks tarball failed checksum verification — refusing to run it"; exit 1; }
          tar -xzf gitleaks.tar.gz gitleaks
          test -x ./gitleaks
          ./gitleaks version
          # --exit-code=1: an UNKNOWN finding fails the step. Known ones live in .gitleaksignore
          # with a reason each. Report is still written either way, so a red run is diagnosable.
          ./gitleaks detect --source=. --redact --no-banner --exit-code=1             --report-format=json --report-path=gitleaks-report.json || GITLEAKS_RC=$?
          COUNT=$(python -c "import json;print(len(json.load(open('gitleaks-report.json'))))")
          echo "## gitleaks — $COUNT finding(s) over the full history" >> "$GITHUB_STEP_SUMMARY"
          if [ "$COUNT" -gt 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Redacted — rule and location only. Resolve each as a real secret (rotate, then purge from history) or a fixture (add to .gitleaksignore with a reason)." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            python -c "import json;[print('- \`%s\` in \`%s\`:%s (commit %s)' % (f.get('RuleID','?'), f.get('File','?'), f.get('StartLine','?'), str(f.get('Commit',''))[:8])) for f in json.load(open('gitleaks-report.json'))]" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Clean — no finding outside .gitleaksignore." >> "$GITHUB_STEP_SUMMARY"
          fi
          # Fail LAST, so the summary above is written first: a red step that explains
          # itself costs one read; a red step that does not costs a re-run.
          if [ "$GITLEAKS_RC" -ne 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**FAILED** — a finding is not in .gitleaksignore. If it is a real secret, ROTATE IT FIRST, then purge it from history; adding it here only silences the report." >> "$GITHUB_STEP_SUMMARY"
            exit "$GITLEAKS_RC"
          fi

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore

      - name: MCP tool-poisoning self-audit (SEC-SUPPLY, report-only)
        continue-on-error: true        # non-gating — surfaces catalog poisoning, never blocks
        working-directory: services/api
        run: |
          pip install sqlalchemy pydantic >/dev/null 2>&1 || true
          echo "## MCP tool-poisoning self-audit" >> "$GITHUB_STEP_SUMMARY"
          PYTHONPATH=src python -m aec_api.supply_chain mcp-audit >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

  sbom:
    # COMPLY-SOC2 / threat-model G-2: publish a per-run SPDX SBOM artifact for diligence.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate SPDX SBOM (repo filesystem)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0
        with:
          path: .
          format: spdx-json
          artifact-name: massing-sbom.spdx.json
          upload-artifact: true

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with: { node-version: "24", cache: npm, cache-dependency-path: package-lock.json }
      - run: npm ci
      - name: npm audit (production deps)
        continue-on-error: true        # report-only — the BLOCKING half is the step below
        run: |
          echo "## npm audit (prod)" >> "$GITHUB_STEP_SUMMARY"
          npm audit --omit=dev >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

      - name: npm audit (full tree, incl. dev)
        continue-on-error: true        # report-only
        run: |
          echo "## npm audit (full tree, incl. dev)" >> "$GITHUB_STEP_SUMMARY"
          npm audit >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

      # DO NOT add continue-on-error or a trailing `|| true` to the step below. The two steps above
      # are report-only by design and this one is the gate — the same report/block pair the bandit
      # steps use. The single npm step these replaced had BOTH escape hatches AND `--omit=dev`, over
      # a tree in which EVERY advisory was dev-only: three independent ways of not being a check,
      # any one of which would have been enough. It printed "found 0 vulnerabilities" while two HIGHs
      # sat in the tree that builds and signs the desktop and mobile artifacts.
      # services/api/test_npm_advisories.py asserts this step keeps neither hatch.
      - name: npm audit — GATE on advisories that HAVE a published fix (blocking)
        run: python3 scripts/audit_npm_gate.py
