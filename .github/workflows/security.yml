name: Dependency scan

# Report-only supply-chain scan (pip-audit + npm audit). Non-blocking by design — it surfaces
# known CVEs in the job summary without failing the merge gate (ci.yml stays the hard gate).
# Runs weekly and on dependency-manifest changes.

on:
  schedule:
    - cron: "0 6 * * 1"          # Mondays 06:00 UTC
  push:
    branches: [main]
    paths:
      - "**/requirements*.txt"
      - "**/package.json"
      - "**/package-lock.json"
      - ".github/workflows/security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }   # match ci.yml — audit the interpreter that actually ships
      - run: pip install pip-audit bandit
      - name: pip-audit (api + data)
        continue-on-error: true        # report-only
        run: |
          for req in services/api/requirements.lock services/data/requirements.txt; do
            echo "## $req" >> "$GITHUB_STEP_SUMMARY"
            pip-audit -r "$req" --desc --format markdown >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          done
      - name: bandit (code security scan, medium+ severity)
        continue-on-error: true        # report-only — surfaces XXE / SSRF / injection patterns
        run: |
          echo "## bandit (services/api + services/data)" >> "$GITHUB_STEP_SUMMARY"
          bandit -q -r services/api/src services/data/src -ll -ii >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
      - name: bandit — GATE on HIGH severity (blocking)
        # The medium+ step above is report-only and stays that way: it is a triage surface, and a
        # blocking check that cries wolf is one people learn to scroll past — this repo already
        # recorded that lesson when a permanently-red analyser trained everyone to ignore red.
        #
        # HIGH is different, and 2026-07-31 is why this exists. A HIGH finding (B613, bidirectional
        # control characters) sat in this workflow's step summary unread for as long as it existed,
        # while the code it flagged was the MCP tool-poisoning detector — whose own character class
        # was written in invisible characters and, as a direct result, missed U+202E entirely. The
        # scanner did its job; nothing was listening.
        #
        # Zero HIGH findings as of this commit, so the gate starts green and can only be tripped by
        # something new. If it fires, read it — do not add continue-on-error.
        run: |
          bandit -q -r services/api/src services/data/src -lll -ii

      - name: gitleaks — secret scan of the full git history
        # SEC-G1. Nothing scanned for committed secrets before this; audits used ad-hoc grep, which
        # finds what it is asked for and nothing else.
        #
        # Scans HISTORY, not just the working tree. A secret that was committed and later "removed"
        # is still in the objects and still published — the working tree is the one place it is
        # guaranteed NOT to be.
        #
        # --redact is load-bearing on a PUBLIC repo. Without it a found secret is printed verbatim
        # into a world-readable Actions log, so the scanner would CREATE the exposure it exists to
        # report. Do not remove it.
        #
        # FINDINGS are report-only for now; a TOOL FAILURE is not. `set -euo pipefail` and the
        # explicit binary check mean a bad URL, a renamed release asset or a failed extract fail this
        # step loudly. Putting `continue-on-error` on the whole step would make all three
        # indistinguishable from "no secrets found" — a scanner that never ran, reporting clean.
        # Gating on findings follows once CI has published one baseline; that is the order bandit
        # went through, and the reason its HIGH gate could start green.
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz             "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          test -x ./gitleaks
          ./gitleaks version
          # --exit-code=0 means FINDINGS do not fail the step. Everything else here still can.
          ./gitleaks detect --source=. --redact --no-banner --exit-code=0             --report-format=json --report-path=gitleaks-report.json
          COUNT=$(python -c "import json;print(len(json.load(open('gitleaks-report.json'))))")
          echo "## gitleaks — $COUNT finding(s) over the full history" >> "$GITHUB_STEP_SUMMARY"
          if [ "$COUNT" -gt 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Redacted — rule and location only. Resolve each as a real secret (rotate, then purge from history) or a fixture (add to .gitleaksignore with a reason)." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            python -c "import json;[print('- \`%s\` in \`%s\`:%s (commit %s)' % (f.get('RuleID','?'), f.get('File','?'), f.get('StartLine','?'), str(f.get('Commit',''))[:8])) for f in json.load(open('gitleaks-report.json'))]" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Clean. After one clean run, drop --exit-code=0 to make findings blocking." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore

      - name: MCP tool-poisoning self-audit (SEC-SUPPLY, report-only)
        continue-on-error: true        # non-gating — surfaces catalog poisoning, never blocks
        working-directory: services/api
        run: |
          pip install sqlalchemy pydantic >/dev/null 2>&1 || true
          echo "## MCP tool-poisoning self-audit" >> "$GITHUB_STEP_SUMMARY"
          PYTHONPATH=src python -m aec_api.supply_chain mcp-audit >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

  sbom:
    # COMPLY-SOC2 / threat-model G-2: publish a per-run SPDX SBOM artifact for diligence.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate SPDX SBOM (repo filesystem)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: massing-sbom.spdx.json
          upload-artifact: true

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with: { node-version: "24", cache: npm, cache-dependency-path: package-lock.json }
      - run: npm ci
      - name: npm audit (production deps)
        continue-on-error: true        # report-only
        run: |
          echo "## npm audit (prod)" >> "$GITHUB_STEP_SUMMARY"
          npm audit --omit=dev >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
