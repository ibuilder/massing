name: Mobile (Capacitor)

# The gate that did not exist when Capacitor 8 shipped.
#
# v0.3.752 asserted the mobile build was verified "in CI"; a grep for capacitor|gradle|android across
# every workflow returned nothing. The typecheck added in v0.3.753 proves `capacitor.config.ts`
# COMPILES against the v8 types — it says nothing about whether `cap sync` produces an app. This does.
#
# `apps/web/android/` is gitignored (regenerated by `cap add`), so the job generates the platform from
# scratch every run. That is a feature, not a workaround: it means the committed config alone is
# sufficient to produce a build, which is the property that actually matters when a Capacitor major
# lands. A checked-in android/ directory can drift into working-by-accident.
#
# iOS is deliberately absent: it needs macOS runners (~10x the minutes) and cannot be built without
# signing assets. Android is the cheap half that catches the same class of breakage — a plugin API
# change, a Gradle/AGP incompatibility, a webDir that no longer exists.

on:
  push:
    branches: [main]
    paths:
      - "apps/web/capacitor.config.ts"
      - "apps/web/package.json"
      - "package-lock.json"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "apps/web/capacitor.config.ts"
      - "apps/web/package.json"
      - "package-lock.json"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      # Capacitor 8's Android platform targets JDK 21; 17 fails on newer AGP.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699  # v4
      - name: Install dependencies
        run: npm ci

      # The web build IS the mobile payload — capacitor.config.ts sets webDir: "dist".
      #
      # `build:mobile`, NOT `build`. That is the whole of the first failure this gate caught: the
      # default build emits pre-compressed `.br`/`.gz` siblings for a static server to serve, and
      # Android's resource merger treats `foo.js` and `foo.js.gz` as the SAME resource — 30+
      # "Duplicate resources" errors and a dead build. `vite.config.ts` already gets this right
      # (`WEB_SERVED = !["desktop","mobile"].includes(mode)`); the workflow simply never passed the
      # mode. The siblings are also pure waste in an APK: a WebView loads from the filesystem, so
      # there is no content negotiation to serve them.
      #
      # `--mode mobile` additionally reads `.env.mobile`, which is where VITE_API_URL points at the
      # hosted API — a phone has no local backend.
      - name: Build the web bundle for mobile
        run: npm run build:mobile --workspace apps/web

      # The payload must contain no pre-compressed siblings. Asserted rather than assumed, because
      # this failure only surfaces 40 seconds into Gradle with an error that names resources rather
      # than the build mode that produced them.
      - name: Assert no pre-compressed siblings in the payload
        run: |
          FOUND=$(find apps/web/dist -name "*.gz" -o -name "*.br" | head -5)
          test -z "$FOUND" || { echo "::error::pre-compressed assets in the mobile payload — wrong build mode"; echo "$FOUND"; exit 1; }
          echo "dist is clean: no .gz/.br siblings"

      - name: Generate the Android platform
        working-directory: apps/web
        run: npx cap add android

      - name: Sync web assets and plugins into the platform
        working-directory: apps/web
        run: npx cap sync android

      # The real assertion. Everything above can succeed while Gradle still refuses to assemble —
      # which is exactly how a Capacitor major breaks a project.
      - name: Assemble debug APK
        working-directory: apps/web/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # An APK that is present but implausibly small is a build that "succeeded" without the payload.
      # Assert it exists AND is a real size, because a green step is not evidence of an artifact.
      - name: Verify the APK is real
        working-directory: apps/web/android
        run: |
          APK=$(find . -name "*-debug.apk" -print -quit)
          test -n "$APK" || { echo "::error::no debug APK produced"; exit 1; }
          SIZE=$(stat -c%s "$APK")
          echo "APK: $APK ($SIZE bytes)"
          test "$SIZE" -gt 1000000 || { echo "::error::APK is only $SIZE bytes — payload missing"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: apps/web/android/**/*-debug.apk
          if-no-files-found: error
          retention-days: 14
