name: DB migrations (Alembic drift guard)

# C1 safety net. `create_all()` + additive `_ensure_*` remain the active runtime path (no cutover in
# this PR), so Alembic can silently drift from the models. This job is what makes that safe: on a
# throwaway Postgres it proves the baseline (a) applies to a fresh empty DB, (b) matches the models
# (`alembic check` — no autogenerate diff), and (c) produces the SAME schema the runtime path builds
# (indexes + columns), which catches drift autogenerate misses (the Postgres-only FTS GIN indexes).
on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - ".github/workflows/db-migrations.yml"
  pull_request:
    paths:
      - "services/api/**"
      - ".github/workflows/db-migrations.yml"

permissions:
  contents: read

jobs:
  migrations:
    name: alembic upgrade + check + runtime-parity (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aec
          POSTGRES_PASSWORD: aec
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aec"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: aec
      PGPASSWORD: aec
      # psql defaults dbname to $PGUSER ("aec"), which the service container never creates
      # (POSTGRES_DB is "postgres") — pin the maintenance DB or every psql call FATALs.
      PGDATABASE: postgres
      STORAGE_DIR: /tmp/aec_storage
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: System deps
        run: |
          # Drop the runner image's preinstalled Google Chrome apt source before updating. On
          # 2026-09-09 it served a Packages.gz whose hash disagreed with a Release file Google had
          # just republished; `apt-get update` exits 100 on a hash mismatch, so this job died
          # before running anything — three times, byte-identically, which is what ruled out a
          # blip. Nothing here installs from that source, and removing the source FILE only stops
          # apt fetching its index; an already-installed Chrome is untouched. A third-party
          # repository we do not use must not be able to fail our build.
          #
          # MATCHED BY CONTENT, NOT BY FILENAME. The first attempt at this fix removed
          # `google-chrome.list` by name and changed nothing, because Ubuntu 24.04 images may
          # define the same repository as deb822 `.sources` instead — a guessed path that silently
          # matches nothing looks exactly like a working fix. Grep decides which files go.
          #
          # Only Google's: the runner carries other third-party sources and the same hazard applies
          # to them in principle, but nothing has been measured failing there and removing them
          # would be fixing a hypothesis.
          # `|| true` because grep exits 1 when it matches nothing, which would sink the
          # whole pipeline on an image that carries no Google source at all. Whether the
          # source was there is the assertion's question, not the removal's.
          { sudo grep -rlZ 'dl\.google\.com' /etc/apt/sources.list.d/ 2>/dev/null || true; } \
            | sudo xargs -0 -r rm -f
          # Prove the removal took, rather than assuming it did as the first attempt had to.
          # Written as an `if`, NOT as `! grep ...`: bash's `set -e` explicitly exempts a
          # command whose status is inverted with `!`, so the negated form would print
          # nothing and carry on with the source still in place — a second check that
          # cannot fail, which is the same defect as the guessed filename it is here to catch.
          if sudo grep -rq 'dl\.google\.com' /etc/apt/sources.list.d/ 2>/dev/null; then
            echo "::error::Google apt source survived removal; apt-get update is unguarded"
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 postgresql-client

      - name: Python deps
        run: |
          python -m pip install --upgrade pip
          # hash-pinned runtime lock — includes alembic + psycopg (the Postgres driver)
          pip install --require-hashes -r services/api/requirements.lock

      - name: Create throwaway databases
        run: |
          psql -c "CREATE DATABASE mig_alembic;"
          psql -c "CREATE DATABASE mig_runtime;"

      - name: alembic upgrade head (fresh empty DB must succeed)
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+psycopg://aec:aec@localhost:5432/mig_alembic
        run: PYTHONPATH=src alembic upgrade head

      - name: alembic check (models must match migrations — no drift)
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+psycopg://aec:aec@localhost:5432/mig_alembic
        run: PYTHONPATH=src alembic check

      - name: Build the runtime-path schema (create_all + _ensure_* + FTS GIN)
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+psycopg://aec:aec@localhost:5432/mig_runtime
        run: PYTHONPATH=src:../data/src python -c "from aec_api import db; db.init_db()"

      - name: Runtime-parity — alembic-built schema must equal create_all+_ensure_* schema
        run: |
          set -euo pipefail
          # Dump indexes (catches the FTS GIN indexes + every metadata index) and columns for each DB,
          # excluding alembic's own bookkeeping table, then diff. Any difference = drift → fail.
          dump() {
            psql -d "$1" -Atc \
              "SELECT tablename||'|'||indexname||'|'||indexdef FROM pg_indexes
               WHERE schemaname='public' AND tablename <> 'alembic_version' ORDER BY 1;" > "$2.idx"
            psql -d "$1" -Atc \
              "SELECT table_name||'|'||column_name||'|'||data_type||'|'||is_nullable
               FROM information_schema.columns
               WHERE table_schema='public' AND table_name <> 'alembic_version' ORDER BY 1;" > "$2.col"
          }
          dump mig_alembic alembic
          dump mig_runtime runtime
          echo "indexes: alembic=$(wc -l < alembic.idx) runtime=$(wc -l < runtime.idx)"
          echo "columns: alembic=$(wc -l < alembic.col) runtime=$(wc -l < runtime.col)"
          rc=0
          if ! diff -u runtime.idx alembic.idx; then echo "::error::index drift between runtime path and Alembic"; rc=1; fi
          if ! diff -u runtime.col alembic.col; then echo "::error::column drift between runtime path and Alembic"; rc=1; fi
          [ "$rc" -eq 0 ] && echo "runtime-path schema and Alembic-upgraded schema are identical"
          exit $rc

      # PIN-SWEEP-PGNULL. `alembic upgrade head` above proves the sweeps APPLY; it proves nothing
      # about what they convert, because it runs against an empty database. This seeds the four
      # representations a `json` pin column can hold — SQL NULL, the scalar `null`, `{}`, and a real
      # anchor — and asserts the corrected sweep converts the scalar `null` while the migration it
      # corrects walks past it. That row is every `None` written before `JSON(none_as_null=True)`
      # landed.
      #
      # The defect needs a driver that DECODES the column, which is what psycopg does and what the
      # app's own SQLite path does not — so `alembic upgrade head` on SQLite would convert the row
      # and look correct. `test_pin_empty.py` reproduces the decode with a registered sqlite3
      # converter so the behaviour is checked on every run; THIS step is what confirms that
      # reproduction is faithful to the driver production actually uses.
      #
      # RUNS LAST, after runtime-parity, and that is not cosmetic: it creates and drops probe
      # tables in `mig_runtime`, and the parity step diffs that database's schema against
      # `mig_alembic`. Placed before it, a probe table left behind by a failed assertion would
      # surface as schema drift — a second, misleading failure on top of the real one.
      #
      # AEC_PG_REQUIRED is what makes this step mean something: without it the script falls back to
      # its no-server branch and asserts only that this step exists, which here would be circular.
      # The script asserts in turn that this step is still in this file, so deleting it reds the
      # normal suite rather than quietly removing the only place the check is real.
      - name: Pin sweep converts a JSON scalar `null` (Postgres driver, not SQLite)
        working-directory: services/api
        env:
          AEC_PG_REQUIRED: "1"
          PGDATABASE: mig_runtime
        run: PYTHONPATH=src:../data/src python test_pin_pgnull.py

      # LOCK-XPROC. `test_pid_lock_xproc.py` is named for cross-process serialisation, and its one
      # exclusion assertion is two THREADS on SQLite — where `_advisory()` takes nothing and the
      # exclusion observed is entirely the in-process RLock. So `pg_advisory_lock` was exercised by
      # no test in the tree. This step is the only place it is exercised at all: two real OS
      # processes contend for one project's lock against the service container.
      #
      # AEC_PG_REQUIRED for the same reason as the step above: without it the script takes its
      # no-server branch and asserts only that this step exists, which here would be circular. The
      # script asserts in turn that this step is still in this file, so deleting it reds the normal
      # suite rather than quietly removing the only place the check is real.
      #
      # Placed after the parity diff, like the pin sweep: this one creates no tables, but it runs
      # against `mig_runtime` and a step that can fail should not be able to leave anything behind
      # ahead of a step that diffs that database's schema.
      - name: Advisory lock excludes two PROCESSES (Postgres, not threads-on-SQLite)
        working-directory: services/api
        env:
          AEC_PG_REQUIRED: "1"
          PGDATABASE: mig_runtime
        run: PYTHONPATH=src:../data/src python test_pid_lock_pgxproc.py

      # RMW-LOCKBOUND. The step above asks whether the advisory lock EXCLUDES; this one asks whether
      # a writer it excludes eventually STOPS. Opposite failure directions -- a lock that excluded
      # nobody passes this file's positive control, and a lock that excluded everybody for ever
      # passes the exclusion check above.
      #
      # This step is the only place the dangerous mutation is caught. Folding the lock timeout back
      # into `_advisory`'s degrade-to-in-process branch leaves `_SQLSTATE_LOCK_TIMEOUT` sitting in
      # the source, so every static check still passes while a contended write proceeds having taken
      # no cross-process lock -- measured, by running that mutation with and without a server.
      #
      # AEC_PG_REQUIRED for the same reason as the two steps above, and the script asserts in turn
      # that this step is still here, so deleting it reds the ordinary suite.
      - name: A bounded wait gives up and does NOT write anyway (Postgres)
        working-directory: services/api
        env:
          AEC_PG_REQUIRED: "1"
          PGDATABASE: mig_runtime
        run: PYTHONPATH=src:../data/src python test_pid_lock_bound.py
