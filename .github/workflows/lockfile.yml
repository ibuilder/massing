name: Lockfile (pip-compile)

# B2 — produce the pinned + hashed Python lock IN the production interpreter (Linux/py3.12), so the
# resolved wheels always match prod. Run manually (workflow_dispatch) after editing requirements.in;
# it uploads the compiled lock as an artifact to download + commit, and (as a gate) also fails on any
# push that leaves services/api/requirements.lock out of date with requirements.in.
on:
  workflow_dispatch:
  push:
    paths:
      - "services/api/requirements.in"
      - "services/api/requirements.lock"
      - ".github/workflows/lockfile.yml"

permissions:
  # write is used by exactly one step — the dependabot write-back below. Every other path in this
  # job only reads; the compile happens in a container and publishes an artifact.
  contents: write

jobs:
  compile:
    name: pip-compile --generate-hashes (py3.12)
    runs-on: ubuntu-latest
    container: python:3.12-slim   # exact prod base image, so the resolution matches the API Dockerfile
    steps:
      # Install git BEFORE checkout. In the slim container git is absent, so actions/checkout falls
      # back to a tarball download with NO .git — then the "Verify" step's `git diff` reports "Not a
      # git repository", exits non-zero, and the lock is wrongly flagged stale. Installing git first
      # makes checkout produce a real working tree so the diff gate actually works.
      - name: Install git (must precede checkout)
        run: |
          apt-get update && apt-get install -y --no-install-recommends git
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v7

      # build tooling in case a dep only ships an sdist and pip-compile must build it to hash
      - name: System deps
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            build-essential python3-dev libgl1 libglib2.0-0 git
          rm -rf /var/lib/apt/lists/*

      # PINNED, because this is the compiler that decides the lock's exact bytes, and the job's own
      # gate fails on any byte difference between a fresh compile and the committed file.
      #
      # It was floating, and the drift is already visible in the committed lock: its header records
      # `pip-compile --allow-unsafe --generate-hashes --no-index ...` while the Compile step below
      # passes no `--no-index` at all. A newer pip-tools started writing that flag into the header
      # itself. Harmless in isolation — a recorded command string — but it means a pip-tools release
      # can change the lock's bytes with no dependency change at all, and the failure surfaces as
      # "requirements.lock is stale" on whatever unrelated PR happens to run next. That sends the
      # reader to the dependency they just edited, which is not where the change came from.
      #
      # NOTHING WILL BUMP THIS FOR YOU. Dependabot's github-actions ecosystem watches `uses:`, not a
      # `pip install` inside a `run:` block, so this pin does not appear in any update lane. Raise it
      # deliberately, and expect the lock's header (or more) to move in the same commit — that is the
      # change being made visible rather than arriving anonymously.
      - name: Install pip-tools
        run: pip install --no-cache-dir pip-tools==7.6.1

      - name: Compile lock
        run: |
          pip-compile --quiet --generate-hashes --allow-unsafe \
            --output-file services/api/requirements.lock \
            services/api/requirements.in

      # Always publish the freshly-compiled lock so a human can download + commit it (bootstrap /
      # manual refresh path).
      - name: Upload compiled lock
        uses: actions/upload-artifact@v7
        with:
          name: requirements-lock
          path: services/api/requirements.lock

      # DEPENDABOT'S PIP PRs WERE UNMERGEABLE BY CONSTRUCTION, and this step is why they no longer
      # are. Dependabot bumps `requirements.in` and cannot regenerate a `--generate-hashes` lock —
      # that needs pip-compile in this container. So the Verify step below found the committed lock
      # stale and failed EVERY pip PR it opened. Measured 2026-09-07: `services/api/requirements.lock`
      # has 19 commits and **0** by dependabot, while the npm lock has 17 of 503. Not neglect; the
      # lane was closed.
      #
      # Scoped to `dependabot/pip/**` deliberately. On a human's branch a stale lock is a mistake
      # worth being told about, and silently fixing it would hide the requirements.in edit that
      # caused it. On a dependabot branch there is nobody to tell.
      - name: Commit the recompiled lock (dependabot pip branches only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/dependabot/pip/')
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if git diff --quiet -- services/api/requirements.lock; then
            echo "lock already current — nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/api/requirements.lock
          git commit -m "chore(deps): recompile requirements.lock for this bump"
          # THE PUSH CAN BE REFUSED, and the failure branch matters more than the success one.
          # Runs triggered by Dependabot receive a restricted GITHUB_TOKEN, and whether it carries
          # contents:write is a repository setting this file cannot assert. If the push fails we
          # MUST still fail the job: the commit exists only locally, so the working tree is clean
          # and the Verify step below would otherwise pass and let a PR merge carrying a STALE
          # LOCK — strictly worse than the red build this step replaces.
          if git push origin "HEAD:${GITHUB_REF#refs/heads/}"; then
            # This push touches requirements.lock, which is in this workflow's own path filter, so
            # it triggers one more run. That run finds the lock current, commits nothing, and stops.
            echo "::notice::recompiled requirements.lock and committed it to this branch"
          else
            echo "::error::could not push the recompiled lock. Dependabot-triggered runs get a restricted token; if contents:write is not granted for Dependabot in this repository's Actions settings, download the 'requirements-lock' artifact from this run and commit it by hand."
            exit 1
          fi

      # On push events, fail if the committed lock doesn't match a fresh compile — catches a
      # requirements.in edit that forgot to regenerate the lock.
      - name: Verify committed lock is up to date
        if: github.event_name == 'push'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"   # container checkout owner mismatch
          if ! git diff --quiet -- services/api/requirements.lock; then
            echo "::error::services/api/requirements.lock is stale — download the 'requirements-lock' artifact from this run and commit it."
            git --no-pager diff -- services/api/requirements.lock | head -60
            exit 1
          fi
          echo "lock is up to date"
