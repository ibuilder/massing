name: Deploy viewer demo to GitHub Pages

# Publishes the GitHub Pages site at https://<owner>.github.io/:
#   /            → the static landing page (docs/index.html)
#   /app/        → the *viewer-only* web app (no API — it streams the committed sample .frag tiles)
# VITE_PAGES=1 swaps the Workbox PWA SW for the coi-serviceworker so SharedArrayBuffer
# (needed by @thatopen/fragments) works on Pages, which can't set COOP/COEP headers itself.

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "docs/**"
      # ...but NOT the internal planning docs. `docs/` doubles as the Pages web root, so the filter
      # above is right about *location* and wrong about *audience*: the roadmap is a planning file
      # that happens to live in the published tree, and every lane touches it on nearly every merge.
      # On 2026-08-06 that fired 20+ full public rebuilds in two hours and the deployments queued
      # behind each other until `actions/deploy-pages` hit its 10-minute wait and failed — main was
      # red from 13:07 for a reason that had nothing to do with the site's content.
      #
      # These files stay published (they are still copied by "Assemble site"); they just no longer
      # *trigger* a deploy on their own. At this merge rate the published copy is refreshed by the
      # next real change within hours, which is the right trade for a doc nothing links to.
      - "!docs/roadmap.md"
      - "!docs/roadmap-directions.md"
      - "!docs/roadmap-completed.md"
      - "!docs/internal/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one in-flight Pages deploy, and let a newer push supersede an older one.
#
# `cancel-in-progress: false` is GitHub's starter-workflow default, written for a repo that merges a
# few times a day: it protects a running publish from being interrupted. At this repo's cadence
# (several lanes merging to main continuously) it inverts — each run holds the single Pages
# deployment slot while the next one polls `deployment_queued` until it times out, so a burst of
# merges produces a queue of ten-minute failures rather than one deploy.
#
# Cancelling is safe HERE specifically because every run publishes the whole site from scratch
# rather than patching the live one: a cancelled deploy leaves the previous version served intact,
# and the run that superseded it publishes newer content. The failure mode this guards against
# (a half-written site) is not reachable with a full-artefact publish.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      # npm workspace: install at the root, then build the web workspace
      - name: Install
        run: npm ci

      - name: Build viewer demo
        run: npm run build --workspace apps/web
        env:
          VITE_PAGES: "1"
          VITE_BASE: "/app/"

      # The PUBLIC build had no size or chunking check of any kind, which is the worst place for that
      # to be true. `ci.yml` runs this step; `pages.yml` never did — and `VITE_PAGES=1` also excludes
      # `VitePWA`, whose precache limit was the only thing that ever objected to a bloated shell (it is
      # what caught a 19.7x eager bundle, by accident, on a different build). So the one configuration
      # facing the public was guarded by neither.
      #
      # This measures the same dist the "Assemble site" step is about to publish, so it gates the
      # artefact rather than a proxy for it.
      - name: Bundle-size budget + vendor split (public build)
        run: npm run budget --workspace apps/web
        env:
          # A SEPARATE budget, because this is a different artefact — not a relaxation of the other.
          #
          # The static demo has no API to fetch from, so `VITE_PAGES=1` inlines the demo corpus
          # (`apps/web/src/demo/demoData.json`, statically imported by `demoApi.ts`) into the ENTRY
          # chunk. That is the demo working as designed, not a regression, so holding it to the
          # default build's 220 would fail honestly-different content and teach everyone to ignore
          # the step. Measured in CI 2026-08-06 at de980159, Brotli:
          #
          #     default (ci.yml)   index  90.2 KB + app 87.8 + css 9.3  =  187.3 KB   (budget 220)
          #     pages   (here)     index 208.0    + app 87.8 + css 9.3  =  305.1 KB
          #
          # 320 is DERIVED, not observed, and that is the point. `services/api/test_file_sizes.py`
          # already ratchets the same artefact from the other end: `DEMO_MAX_BYTES = 1_500_000`, and
          # demoData.json is at 1,400,488 — 93.4% of a ceiling it is explicitly allowed to reach.
          # Growing into that permitted headroom adds ~6 KB Brotli here, so any budget below ~311
          # makes the two gates CONTRADICT each other: a demo-corpus change that passes its own
          # size gate would be guaranteed to fail this one. Two ratchets over one artefact have to
          # be consistent or the pair is unsatisfiable. 320 covers demoData reaching DEMO_MAX_BYTES
          # with ~3% left for the shell itself; **lower it here whenever DEMO_MAX_BYTES comes down.**
          #
          # This number replaces a WRONG one, and the way it was wrong is the reusable part. The
          # previous note claimed "300 is a RATCHET on today's real number (284.5)". 284.5 was real,
          # but it was measured in a working tree sitting many releases behind the commit it was
          # attributed to — a tree whose demoData.json was 1,097,315 bytes against 1,400,488 on
          # main. The 303 KB of raw JSON in between is the entire 18.7 KB gap. The true shell at
          # that commit was already ~305, so the budget was set BELOW the artefact it was gating and
          # failed on its first real run. A local build is not a measurement of a commit unless the
          # tree is at that commit; under the temp-index release pattern the working tree is
          # routinely stale, so measure in CI or verify the tree first.
          BUNDLE_BUDGET_KB: "320"

      # assemble the Pages site: landing page at the root, viewer demo under /app/
      #
      # `docs/` doubles as the web root, so a plain `cp -r docs/.` publishes everything in it. That is
      # how every internal audit, superseded plan and the 264 KB completed-roadmap ended up served as
      # pages on massing.build, beside the user guide and indistinguishable from it. `docs/internal/`
      # is the working record — it stays in the repo and out of the site.
      # `docsPublished.test.ts` fails if an internal note lands where this step would publish it.
      - name: Assemble site
        run: |
          mkdir -p _site/app
          cp -r docs/. _site/
          rm -rf _site/internal
          cp -r apps/web/dist/. _site/app/
          touch _site/.nojekyll
          echo massing.build > _site/CNAME

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
